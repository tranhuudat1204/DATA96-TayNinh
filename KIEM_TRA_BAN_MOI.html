<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>DATA96+ Tây Ninh · Đăng nhập</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.55 system-ui,"Segoe UI",sans-serif;background:#081729;color:#e8effb}body{min-height:100svh;display:grid;place-items:center;padding:20px}.card{width:100%;max-width:460px;border:1px solid #284462;border-radius:18px;background:linear-gradient(150deg,#142e49,#0d2034);padding:30px;box-shadow:0 25px 85px #0004}.tag{font:700 11px/1.4 system-ui;letter-spacing:.16em;color:#83c7da}.logo{font-size:32px;font-weight:800;margin:12px 0 4px}.sub{margin:0 0 26px;color:#a9c1d8}.label{display:block;font-weight:650;margin-bottom:7px}input{width:100%;font:inherit;padding:13px 14px;border-radius:9px;border:1px solid #426079;background:#071a2d;color:#fff}input:focus-visible,button:focus-visible{outline:2px solid #6ee7ed;outline-offset:3px}.pw{display:flex;align-items:center;gap:8px}.pw input{flex:1;width:1px}.pw button{background:#233b52;border:1px solid #41607b;color:#dce8f4;padding:12px 10px;font:inherit;border-radius:8px;cursor:pointer}.go{border:0;border-radius:9px;background:#0f89b5;color:#fff;min-height:46px;padding:12px 18px;font:700 15px system-ui;width:100%;margin-top:18px;cursor:pointer}.go:disabled{opacity:.6;cursor:wait}.foot{font-size:12px;color:#88a1b9;margin:24px 0 0}.notice{margin-top:12px;min-height:24px;color:#ffd18d}a{color:#9ce5ff}
</style></head><body><main class="card" id="login"><div class="tag">DATA96+ · TÂY NINH</div><h1 class="logo">Dữ liệu và dự báo cấp xã</h1><p class="sub">Truy cập hệ thống dành cho người được cấp quyền</p><form id="form"><label class="label" for="password">Mật khẩu truy cập</label><div class="pw"><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="256" placeholder="Nhập mật khẩu"><button id="show" type="button" aria-label="Hiện hoặc ẩn mật khẩu">Hiện</button></div><button class="go" id="submit" type="submit">Đăng nhập DATA96+</button></form><div class="notice" id="notice" role="status" aria-live="polite"></div><p class="foot">© 2026 Trần Hữu Đạt · Phiên bản DATA96+ chính thức</p></main><script>
(()=>{'use strict';
 const WORKER='https://data96-security.tranhuudat120419841985.workers.dev';
 const form=document.getElementById('form'),pwd=document.getElementById('password'),notice=document.getElementById('notice'),submit=document.getElementById('submit');
 document.getElementById('show').addEventListener('click',ev=>{const on=pwd.type==='password';pwd.type=on?'text':'password';ev.currentTarget.textContent=on?'Ẩn':'Hiện'});
 function setState(s){notice.textContent=s}
 async function jsonResponse(res){let obj;try{obj=await res.json()}catch{throw Error('Máy chủ không phản hồi đúng định dạng')};if(!res.ok)throw Error(res.status===401?'Mật khẩu không đúng hoặc phiên đăng nhập đã hết hạn':obj.error||('Lỗi kết nối HTTP '+res.status));return obj}
 async function api(path,token){return jsonResponse(await fetch(WORKER+path,{method:'GET',mode:'cors',cache:'no-store',headers:{Authorization:'Bearer '+token}}))}
 function startApp(token,html,seeds){
   const rawGet=document.getElementById.bind(document),rawFetch=window.fetch.bind(window);
   // Dataset is kept solely in memory. A saved HTML file does not contain original embedded datasets.
   document.getElementById=function(id){if(Object.prototype.hasOwnProperty.call(seeds,id))return {textContent:seeds[id]};return rawGet(id)};
   const PREFIX='/DATA96-TayNinh/';
   const protectedPaths=new Set(['vanban-data.json','data/vanban-moi.json','data/version.json','version.json','cameras.json','data/cameras.json','data/nguon-quet.json']);
   window.fetch=function(input,init){
     try{
       const url=new URL(typeof input==='string'?input:input.url,location.href);
       if(url.origin===location.origin && url.pathname.startsWith(PREFIX)){
         const path=url.pathname.slice(PREFIX.length);
         if(protectedPaths.has(path)){
            const headers=new Headers(init&&init.headers||{});headers.set('Authorization','Bearer '+token);
            return rawFetch(WORKER+'/v1/file/'+encodeURIComponent(path),{...init,method:'GET',headers,mode:'cors',cache:'no-store'});
         }
       }
     }catch(e){console.warn('DATA96 request',e)}
     return rawFetch(input,init);
   };
   document.open();document.write(html);document.close();
 }
 form.addEventListener('submit',async e=>{
   e.preventDefault();const password=pwd.value;if(!password)return;submit.disabled=true;setState('Đang xác thực với máy chủ...');
   try{
     const login=await jsonResponse(await fetch(WORKER+'/v1/login',{method:'POST',mode:'cors',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})}));
     pwd.value='';setState('Đang tải dữ liệu và ứng dụng đã cấp quyền...');
     const [app,data]=await Promise.all([api('/v1/app',login.token),api('/v1/seeds',login.token)]);
     if(typeof app.html!=='string'||!data.seeds||typeof data.seeds.D96!=='string')throw Error('Dữ liệu ứng dụng không hợp lệ');
     startApp(login.token,app.html,data.seeds);
   }catch(err){setState('Không đăng nhập được: '+err.message);submit.disabled=false}
 });
})();
</script></body></html>
