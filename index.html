nh</h3><p class="sub">Trung bình có trọng số của bảy chỉ số, chuẩn hóa lại về 0–100. Trọng số do người dùng đặt — nghĩa là bảng xếp hạng phản ánh <b>ưu tiên chính sách của người ra quyết định</b>, không phải một thứ tự cố định do phần mềm áp đặt. Sáu bộ trọng số mẫu tương ứng sáu nhóm mục tiêu thường gặp.</p><h3 class="sh">Phân cụm hình thái</h3><p class="sub">Thuật toán k-means với k = 6 chạy trên sáu chỉ số, khởi tạo lại 40 lần và giữ kết quả có tổng sai số nhỏ nhất. Tên nhóm đặt theo chỉ số trội nhất của tâm cụm.</p><h3 class="sh">Định mức hạ tầng</h3><p class="sub">35 giường bệnh/vạn dân và 30 m² sàn nhà ở/người lấy theo mục tiêu quốc gia đến năm 2030; 35 học sinh/lớp theo chuẩn lớp tiểu học; 120 lít nước/người/ngày và 0,9 kg rác/người/ngày là định mức quy hoạch thông dụng. Đây là định mức tham chiếu, cần thay bằng định mức của ngành và của tỉnh khi lập dự án cụ thể.</p><h3 class="sh">Dự báo dân số</h3><p class="sub">Mô hình tăng trưởng lũy thừa với tốc độ đặt theo loại hình kinh tế của từng xã (từ 0,3%/năm ở vùng nông nghiệp Đồng Tháp Mười tới 2,6%/năm ở vùng công nghiệp – đô thị), có hiệu chỉnh theo khoảng cách tới TP.HCM.</p><div class="note"><b>Giới hạn cần nêu rõ với chủ đầu tư.</b> Bảy chỉ số, phân cụm và dự báo trong bản này là <b>chỉ số tổng hợp tham khảo</b> dựng từ dữ liệu ranh giới, dân số và diện tích cùng lớp phân loại địa hình – kinh tế. Chúng chưa được hiệu chuẩn với chuỗi số liệu thống kê thực đo, nên dùng để <b>sàng lọc và đặt thứ tự ưu tiên</b>, không dùng thay cho số liệu chính thức trong văn bản pháp lý. Để nâng lên mức dự báo có kiểm định, cần bổ sung các nguồn ở giai đoạn 2 và 3 nêu trên.</div><h3 class="sh">Về sản phẩm</h3><div class="srcitem"><h4>Tác giả và bản quyền</h4><p><b>Trần Hữu Đạt</b> — Đảng uỷ xã Cần Giuộc, tỉnh Tây Ninh. Tác giả chịu trách nhiệm về ý tưởng, thiết kế bộ chỉ số, lựa chọn nguồn dữ liệu và toàn bộ nội dung nghiệp vụ của sản phẩm. Mọi góp ý và yêu cầu cập nhật số liệu xin gửi về tác giả.</p></div><div class="srcitem"><h4>Cách sản phẩm được xây dựng</h4><p>Ba lớp: lớp nền là bảng ánh xạ 306 đơn vị hành chính cũ sang 96 đơn vị mới cùng ranh giới số; lớp hồ sơ là 96 trang thông tin đơn vị hành chính; lớp phân tích gồm bộ bảy chỉ số điều hành, phân nhóm hình thái, mô phỏng kịch bản và đối chiếu với 34 tỉnh, thành. Toàn bộ chạy trong một tệp duy nhất trên trình duyệt, không cần cài đặt và không cần máy chủ.</p></div><div class="srcitem"><h4>Điều kiện sử dụng</h4><p>Sản phẩm phục vụ tra cứu, sàng lọc và đặt thứ tự ưu tiên trong công tác điều hành. Không thay thế số liệu thống kê chính thức trong văn bản pháp lý. Khi trích dẫn lại, đề nghị ghi rõ nguồn gốc số liệu như nêu ở trên.</p></div><h3 class="sh">Thể hiện chủ quyền biển đảo</h3><p class="sub">Bản đồ toàn quốc trong phần mềm thể hiện đầy đủ <b>quần đảo Hoàng Sa</b> và <b>quần đảo Trường Sa</b> thuộc chủ quyền của Việt Nam, đặt đúng vị trí theo tọa độ địa lý thực. Bản đồ chính cũng gắn nhãn hai quần đảo tại đúng vị trí, hiển thị khi thu nhỏ về phạm vi toàn quốc.</p><h3 class="sh">Tuân thủ pháp lý</h3><p class="sub">Sản phẩm chỉ dùng dữ liệu tổng hợp ở cấp đơn vị hành chính, không chứa và không suy diễn dữ liệu cá nhân, phù hợp Nghị định 13/2023/NĐ-CP. Việc khai thác các bộ dữ liệu chưa gắn giấy phép mở trên cổng tỉnh cần văn bản chấp thuận của Sở Khoa học và Công nghệ — đơn vị vận hành cổng. Luật Dữ liệu số 60/2024/QH15 có hiệu lực từ 01/7/2025 là khung pháp lý cho việc cung cấp sản phẩm, dịch vụ dữ liệu.</p>'}function I(){const t=p("pbody");t.querySelectorAll("tr[data-ma]").forEach(t=>t.onclick=()=>M(t.dataset.ma)),t.querySelectorAll("[data-act]").forEach(t=>{t.onclick=s=>{s.stopPropagation();const e=t.dataset.act,c=t.dataset.ma;if("go"===e)M(c);else if("cmp"===e)r.cmp.length<4&&!r.cmp.includes(c)&&r.cmp.push(c),r.tab="so-sanh",P(),z();else if("uncmp"===e)r.cmp=r.cmp.filter(t=>t!==c),z();else if("clearcmp"===e)r.cmp=[],z();else if("clear"===e)r.sel=null,z(),F();else if("csv"===e)(()=>{const t=["ma","ten","loai","cluster_name","
